name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages + static demo
        run: |
          pnpm --filter @plana/core build
          pnpm --filter @plana/renderer build
          pnpm --filter @plana/viewer build
          pnpm --filter @plana/editor build
          pnpm --filter @plana/editor preview:build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: packages/editor/dev-dist
          force_orphan: true
          enable_jekyll: false
          commit_message: "deploy: ${{ github.sha }}"
